name: ci
on:
  # Server branches are pushed and never PR'd into main, so they must trigger CI on push.
  push:
    branches: [main, "mcp/**"]
  pull_request:

# Each server branch holds one server at the repo root; main holds none.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the server and the dev tools
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        # Exit code 5 means "no tests collected", which is expected on main (no server).
        run: uv run pytest -q || [ $? -eq 5 ]
