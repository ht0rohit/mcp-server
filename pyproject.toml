# Starter for a server branch. main holds no server, so this file only carries the shared dev
# tools and the pytest and ruff config. A new server branch turns it into the server's own
# project: set the name, description and dependencies, add [project.scripts] and
# [build-system], and drop [tool.uv] package = false (see docs/adding-a-server.md).
[project]
name = "mcp-server-lab"
version = "0.0.0"
description = "Learning Python MCP best practices, one server at a time"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
