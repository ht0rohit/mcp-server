[project]
name = "x-advanced-http"
version = "0.1.0"
description = "Advanced X (Twitter) MCP server over Streamable HTTP"
readme = "README.md"
authors = [
    { name = "Rohit Kr Singh", email = "ht97kumarrk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
]

[project.scripts]
x-advanced-http = "x_advanced_http:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
