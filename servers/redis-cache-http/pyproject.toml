[project]
name = "redis-cache-http"
version = "0.1.0"
description = "Redis cache MCP server over Streamable HTTP"
readme = "README.md"
authors = [
    { name = "Rohit Kr Singh", email = "ht97kumarrk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic-settings>=2.6",
    "redis>=5.2,<7",
]

[project.scripts]
redis-cache-http = "redis_cache_http:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.26",
]
