[project]
name = "x-basic-stdio"
version = "0.1.0"
description = "Basic read-only X (Twitter) MCP server over stdio"
readme = "README.md"
authors = [
    { name = "Rohit Kr Singh", email = "ht97kumarrk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2,<3",
]

[project.scripts]
x-basic-stdio = "x_basic_stdio:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
